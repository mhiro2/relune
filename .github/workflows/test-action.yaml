name: Test Action

on:
  pull_request:
    paths:
      - ".github/workflows/test-action.yaml"
      - "action/**"
      - "crates/relune-cli/**"
      - "crates/relune-app/**"
      - "crates/relune-core/**"
      - "crates/relune-parser-sql/**"
      - "fixtures/sql/**"
      - "fixtures/review/**"
      - "Cargo.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

permissions:
  contents: read

jobs:
  test-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - name: Build relune
        run: cargo build -p relune-cli --release
      - name: Test action (no changes)
        id: diff-no-changes
        uses: ./action
        with:
          before: fixtures/sql/simple_blog.sql
          after: fixtures/sql/simple_blog.sql
          binary-path: target/release/relune
      - name: Verify no changes detected
        run: |
          if [[ "${{ steps.diff-no-changes.outputs.has-changes }}" != "false" ]]; then
            echo "::error::Expected has-changes=false for identical schemas"
            exit 1
          fi
          if [[ "${{ steps.diff-no-changes.outputs.output-path }}" != "relune-diff.md" ]]; then
            echo "::error::Expected the markdown default output path relune-diff.md"
            exit 1
          fi
          if ! grep -qx "No schema changes detected." relune-diff.md; then
            echo "::error::Expected the diff report to state that nothing changed"
            exit 1
          fi
      - name: Test action (with changes)
        id: diff-with-changes
        uses: ./action
        with:
          before: fixtures/sql/simple_blog.sql
          after: fixtures/sql/ecommerce.sql
          output-path: ${{ runner.temp }}/diff-with-changes.md
          binary-path: target/release/relune
      - name: Verify changes detected
        env:
          REPORT: ${{ steps.diff-with-changes.outputs.output-path }}
        run: |
          if [[ "${{ steps.diff-with-changes.outputs.has-changes }}" != "true" ]]; then
            echo "::error::Expected has-changes=true for different schemas"
            exit 1
          fi
          if [[ "${REPORT}" != "${RUNNER_TEMP}/diff-with-changes.md" ]]; then
            echo "::error::Expected output-path to echo the requested path, got '${REPORT}'"
            exit 1
          fi
          if ! grep -q "7 added, 3 removed" "${REPORT}" || ! grep -qw "order_items" "${REPORT}"; then
            echo "::error::Diff report does not describe the simple_blog -> ecommerce change"
            exit 1
          fi

      # ----------------------------------------------------------------
      # Review mode smoke tests
      # ----------------------------------------------------------------
      - name: Test action (review, no findings)
        id: review-no-findings
        uses: ./action
        with:
          mode: review
          before: fixtures/sql/simple_blog.sql
          after: fixtures/sql/simple_blog.sql
          deny: breaking
          binary-path: target/release/relune
      - name: Verify review (no findings)
        run: |
          if [[ "${{ steps.review-no-findings.outputs.has-findings }}" != "false" ]]; then
            echo "::error::Expected has-findings=false for identical schemas"
            exit 1
          fi
          if [[ "${{ steps.review-no-findings.outputs.has-blocking-findings }}" != "false" ]]; then
            echo "::error::Expected has-blocking-findings=false for identical schemas"
            exit 1
          fi
          if [[ "${{ steps.review-no-findings.outputs.output-path }}" != "relune-review.md" ]]; then
            echo "::error::Expected the markdown default output path relune-review.md"
            exit 1
          fi
          if ! grep -q "0 breaking" relune-review.md; then
            echo "::error::Expected the review report to show zero findings"
            exit 1
          fi

      - name: Test action (review, warning only)
        id: review-warning
        uses: ./action
        with:
          mode: review
          before: fixtures/review/add-not-null-on-existing/before.sql
          after: fixtures/review/add-not-null-on-existing/after.sql
          deny: breaking
          binary-path: target/release/relune
      - name: Verify review (warning only)
        run: |
          if [[ "${{ steps.review-warning.outputs.has-findings }}" != "true" ]]; then
            echo "::error::Expected has-findings=true for warning fixture"
            exit 1
          fi
          if [[ "${{ steps.review-warning.outputs.has-blocking-findings }}" != "false" ]]; then
            echo "::error::Expected has-blocking-findings=false (warning is below breaking)"
            exit 1
          fi
          if [[ "${{ steps.review-warning.outputs.summary-warning }}" -lt 1 ]]; then
            echo "::error::Expected summary-warning >= 1"
            exit 1
          fi

      # Auto-detection resolves this SQL to PostgreSQL, where dropping a
      # column does not rebuild the table, so the caution only appears when
      # the dialect input reaches the CLI.
      - name: Test action (review, lock-risk caution with dialect)
        id: review-lock-risk
        uses: ./action
        with:
          mode: review
          before: fixtures/review/lock-risk/rewrite-table-mysql-column-drop/before.sql
          after: fixtures/review/lock-risk/rewrite-table-mysql-column-drop/after.sql
          dialect: mysql
          rules: risk/rewrite-table
          deny: breaking
          output-path: ${{ runner.temp }}/review-lock-risk.md
          binary-path: target/release/relune
      - name: Verify review (lock-risk caution)
        env:
          REPORT: ${{ steps.review-lock-risk.outputs.output-path }}
        run: |
          if [[ "${{ steps.review-lock-risk.outputs.has-findings }}" != "true" ]]; then
            echo "::error::Expected has-findings=true for lock-risk fixture under dialect: mysql"
            exit 1
          fi
          if [[ "${{ steps.review-lock-risk.outputs.has-blocking-findings }}" != "false" ]]; then
            echo "::error::Expected has-blocking-findings=false (caution is below breaking)"
            exit 1
          fi
          if [[ "${{ steps.review-lock-risk.outputs.summary-caution }}" != "1" ]]; then
            echo "::error::Expected exactly one caution from risk/rewrite-table under dialect: mysql"
            exit 1
          fi
          if [[ "${{ steps.review-lock-risk.outputs.summary-breaking }}" != "0" ]]; then
            echo "::error::Expected the rules filter to drop risk/drop-column"
            exit 1
          fi
          if ! grep -q "risk/rewrite-table" "${REPORT}" || ! grep -q "table rebuild (mysql)" "${REPORT}"; then
            echo "::error::Review report does not name the MySQL table rebuild"
            exit 1
          fi

      - name: Test action (review, breaking, no fail)
        id: review-breaking
        uses: ./action
        with:
          mode: review
          before: fixtures/review/drop-column-referenced/before.sql
          after: fixtures/review/drop-column-referenced/after.sql
          deny: breaking
          fail-on-blocking: "false"
          output-path: ${{ runner.temp }}/review-breaking.md
          binary-path: target/release/relune
      - name: Verify review (breaking, no fail)
        env:
          REPORT: ${{ steps.review-breaking.outputs.output-path }}
        run: |
          if [[ "${{ steps.review-breaking.outputs.has-findings }}" != "true" ]]; then
            echo "::error::Expected has-findings=true for breaking fixture"
            exit 1
          fi
          if [[ "${{ steps.review-breaking.outputs.has-blocking-findings }}" != "true" ]]; then
            echo "::error::Expected has-blocking-findings=true for breaking fixture"
            exit 1
          fi
          if [[ "${{ steps.review-breaking.outputs.summary-breaking }}" -lt 1 ]]; then
            echo "::error::Expected summary-breaking >= 1"
            exit 1
          fi
          if [[ "${REPORT}" != "${RUNNER_TEMP}/review-breaking.md" ]]; then
            echo "::error::Expected output-path to echo the requested path, got '${REPORT}'"
            exit 1
          fi
          if ! grep -q "risk/drop-column-referenced" "${REPORT}"; then
            echo "::error::Review report does not list risk/drop-column-referenced"
            exit 1
          fi

      - name: Test action (review, breaking, fail-on-blocking)
        id: review-breaking-fail
        continue-on-error: true
        uses: ./action
        with:
          mode: review
          before: fixtures/review/drop-column-referenced/before.sql
          after: fixtures/review/drop-column-referenced/after.sql
          deny: breaking
          fail-on-blocking: "true"
          output-path: ${{ runner.temp }}/review-breaking-fail.md
          binary-path: target/release/relune
      - name: Verify review (breaking, fail-on-blocking)
        run: |
          if [[ "${{ steps.review-breaking-fail.outcome }}" != "failure" ]]; then
            echo "::error::Expected step outcome=failure when fail-on-blocking=true and breaking finding present"
            exit 1
          fi
          if [[ "${{ steps.review-breaking-fail.outputs.has-blocking-findings }}" != "true" ]]; then
            echo "::error::Expected has-blocking-findings=true even when action fails"
            exit 1
          fi

      - name: Test action (invalid mode)
        id: review-invalid-mode
        continue-on-error: true
        uses: ./action
        with:
          mode: bogus
          before: fixtures/sql/simple_blog.sql
          after: fixtures/sql/simple_blog.sql
          binary-path: target/release/relune
      - name: Verify invalid mode fails
        run: |
          if [[ "${{ steps.review-invalid-mode.outcome }}" != "failure" ]]; then
            echo "::error::Expected step outcome=failure for unknown mode"
            exit 1
          fi
      - name: Verify invalid mode diagnostic and exit code
        env:
          MODE: bogus
        run: |
          set +e
          out=$(bash action/run.sh 2>&1)
          rc=$?
          set -e
          if [[ ${rc} -ne 2 ]]; then
            echo "::error::Expected exit code 2 for unknown mode, got ${rc}"
            exit 1
          fi
          if [[ "${out}" != *"Invalid mode 'bogus'"* ]]; then
            echo "::error::Expected the unknown mode diagnostic, got: ${out}"
            exit 1
          fi
