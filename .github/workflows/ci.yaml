name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: package.json
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frontend packages
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: make fmt-check
      - name: Run lint
        run: make lint
      - name: Test HTML viewer
        run: make test-html-viewer

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.87.29
        with:
          tool: cargo-llvm-cov
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2.87.29
        with:
          tool: wasm-pack
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"  # for `wasm-pack test --node`
      - name: Test
        run: make test-ci
      - name: Coverage analysis
        uses: k1LoW/octocov-action@v1.5.2
        with:
          config: .octocov.yaml

  playground:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2.87.29
        with:
          tool: wasm-pack
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: package.json
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install playground packages
        run: pnpm install --frozen-lockfile
      - name: Test and build playground
        run: make test-playground

  large-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
      - name: Test large-schema layouts
        run: make test-large

  deny-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2.87.29
        with:
          tool: cargo-deny
      - name: Run cargo-deny
        run: make deny-check
