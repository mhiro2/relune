[licenses]
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[advisories]
yanked = "deny"
ignore = [
  # rustls-pemfile: marked unmaintained. Reached transitively via
  # sqlx-postgres / hyper-rustls; replacement landed in newer sqlx
  # releases.
  "RUSTSEC-2025-0134",
  # tokio-tar: PAX header smuggling. Used only by testcontainers
  # (dev-dep). Maintainer recommends astral-tokio-tar; testcontainers
  # has not migrated yet.
  "RUSTSEC-2025-0111",
  # ttf-parser: marked unmaintained. Reached transitively via resvg /
  # usvg / rustybuzz for SVG rasterization; no safe upgrade available
  # upstream. Revisit when resvg migrates off ttf-parser.
  "RUSTSEC-2026-0192",
  # rustybuzz: marked unmaintained. Reached transitively via resvg /
  # usvg for SVG rasterization; no safe upgrade available upstream.
  # Revisit when resvg migrates to harfrust.
  "RUSTSEC-2026-0206",
]

[bans]
multiple-versions = "warn"
# Path-only deps between workspace crates are exempted via
# allow-wildcard-paths because every crate is `publish = false`;
# wildcard version requirements on external crates are denied.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
