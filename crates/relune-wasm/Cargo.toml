[package]
name = "relune-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "WebAssembly bindings for relune"

# `make build-playground` builds with `--profile wasm-release`, which wasm-pack
# maps to its `custom` profile. The feature flags match the WASM proposals
# rustc enables by default for wasm32-unknown-unknown.
[package.metadata.wasm-pack.profile.custom]
wasm-opt = [
  "-Os",
  "--enable-bulk-memory",
  "--enable-mutable-globals",
  "--enable-multivalue",
  "--enable-nontrapping-float-to-int",
  "--enable-reference-types",
  "--enable-sign-ext",
]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
relune-app = { path = "../relune-app" }
relune-core = { path = "../relune-core" }
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true
console_error_panic_hook = { workspace = true, optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true
