name: Playground

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: playground-pages
  # Let a running Pages deployment finish instead of cancelling it midway.
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2.87.29
        with:
          tool: wasm-pack
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: package.json
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install playground packages
        run: pnpm install --frozen-lockfile
      - name: Build playground
        run: make build-playground
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: playground/dist

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
