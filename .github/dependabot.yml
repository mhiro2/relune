version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      serde:
        patterns:
          - "serde"
          - "serde_json"
      tracing:
        patterns:
          - "tracing"
          - "tracing-subscriber"
      resvg:
        patterns:
          - "resvg"
          - "fontdb"
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      codemirror:
        patterns:
          - "@codemirror/*"
          - "codemirror"
      oxc:
        patterns:
          - "oxlint"
          - "oxlint-tsgolint"
          - "oxfmt"
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
